name: Android Emulator CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level'
        required: false
        default: '34'
        type: choice
        options: ['29', '31', '33', '34', '35']
      target:
        description: 'System image target'
        required: false
        default: 'google_apis'
        type: choice
        options: ['default', 'google_apis', 'google_apis_playstore', 'aosp_atd']
      profile:
        description: 'Device profile'
        required: false
        default: 'pixel_6'
        type: choice
        options: ['pixel_6', 'pixel_7', 'pixel_tablet', 'Nexus 6']
      timeout_hours:
        description: 'Job timeout in hours'
        required: false
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache=true
  JAVA_VERSION: '17'
  DEFAULT_TIMEOUT_MINUTES: '360'

jobs:
  validate:
    name: Validate Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4

  emulator-tests:
    name: API ${{ matrix.api-level }} / ${{ matrix.target }} / ${{ matrix.profile }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api-level: 29
            target: google_apis
            profile: Nexus 6
            arch: x86_64
            experimental: false
          - api-level: 31
            target: google_apis
            profile: pixel_6
            arch: x86_64
            experimental: false
          - api-level: 34
            target: google_apis
            profile: pixel_6
            arch: x86_64
            experimental: false
          - api-level: 35
            target: google_apis_playstore
            profile: pixel_7
            arch: x86_64
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 10

      - name: Enable KVM
        timeout-minutes: 5
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        timeout-minutes: 10
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 15
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
          validate-wrappers: false

      - name: Cache AVD Snapshot
        id: avd-cache
        uses: actions/cache@v4
        timeout-minutes: 30
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.arch }}-v1

      - name: Create AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 120
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot-save
          disable-animations: false
          disable-spellchecker: true
          script: echo "AVD snapshot generated for caching."

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 300
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot-save
          disable-animations: true
          disable-spellchecker: true
          script: |
            ./gradlew connectedDebugAndroidTest \
              --stacktrace \
              --no-daemon \
              -Pandroid.testInstrumentationRunnerArguments.notAnnotation=androidx.test.filters.FlakyTest

      - name: Collect Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        with:
          name: test-reports-api${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect Logcat
        if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 15
        with:
          name: logcat-api${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            ~/.android/logcat.log
            **/logcat*.txt
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: CI Summary
    if: always()
    needs: [validate, emulator-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post Summary
        run: |
          echo "## Android Emulator CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Emulator Tests | ${{ needs.emulator-tests.result }} |" >> $GITHUB_STEP_SUMMARY
